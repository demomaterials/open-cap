{{- if .Values.networkPolicy.enabled }}
# Edge-facing services accept traffic only from the Envoy proxies (and each other).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cap-edge-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [cap-frontend, cap-backend, cap-presenter, cap-collector]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: open-cap
      ports:
        - { port: 8080, protocol: TCP }
---
# The evaluator (and its /internal API) is reachable only from the backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cap-evaluator-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cap-evaluator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cap-backend
      ports:
        - { port: 8080, protocol: TCP }
---
# Postgres accepts connections only from open-cap pods in this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cap-db-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cap-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: open-cap
      ports:
        - { port: 5432, protocol: TCP }
{{- end }}

{{- $ctx := dict "root" . "name" "cap-evaluator" "component" "evaluator" }}
# Each replica has its own OPA sidecar on localhost:8181; policies are loaded
# lazily per control version, so replicas never share state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap-evaluator
  labels:
    {{- include "cap.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.evaluator.replicas }}
  selector:
    matchLabels:
      {{- include "cap.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cap.labels" $ctx | nindent 8 }}
    spec:
      {{- include "cap.imagePullSecrets" . | nindent 6 }}
      {{- include "cap.podSecurity" . | nindent 6 }}
      containers:
        - name: evaluator
          image: {{ .Values.evaluator.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "cap.dbEnv" . | nindent 12 }}
            - { name: OPA_URL, value: "http://127.0.0.1:8181" }
            - { name: EVAL_BATCH, value: {{ .Values.evaluator.batch | quote }} }
            - { name: EVAL_CONCURRENCY, value: {{ .Values.evaluator.concurrency | quote }} }
            - { name: EVAL_SWEEP_SECONDS, value: {{ .Values.evaluator.sweepSeconds | quote }} }
          {{- include "cap.probes" . | nindent 10 }}
          {{- include "cap.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.evaluator.resources | nindent 12 }}
        - name: opa
          image: {{ .Values.evaluator.opa.image }}
          imagePullPolicy: IfNotPresent
          # Bound to localhost: only the evaluator container can reach it.
          args: ["run", "--server", "--addr=127.0.0.1:8181", "--disable-telemetry", "--log-level=error"]
          # No probes: kubelet cannot reach the pod's loopback. The evaluator's
          # /readyz checks OPA, so the pod goes unready if OPA is down.
          {{- include "cap.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.evaluator.opa.resources | nindent 12 }}
---
{{ include "cap.service" $ctx }}

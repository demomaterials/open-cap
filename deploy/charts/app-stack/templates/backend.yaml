{{- $ctx := dict "root" . "name" "cap-backend" "component" "backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap-backend
  labels:
    {{- include "cap.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "cap.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cap.labels" $ctx | nindent 8 }}
    spec:
      {{- include "cap.imagePullSecrets" . | nindent 6 }}
      {{- include "cap.podSecurity" . | nindent 6 }}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "cap.dbEnv" . | nindent 12 }}
            {{- include "cap.secretEnv" (dict "root" . "key" "JWT_SECRET") | nindent 12 }}
            {{- include "cap.secretEnv" (dict "root" . "key" "CAP_ENCRYPTION_KEY") | nindent 12 }}
            {{- include "cap.secretEnv" (dict "root" . "key" "ADMIN_PASSWORD") | nindent 12 }}
            - { name: ADMIN_USERNAME, value: {{ .Values.backend.adminUsername | quote }} }
            - { name: CAP_SEED_CATALOG, value: {{ .Values.backend.seedCatalog | quote }} }
            - { name: SESSION_HOURS, value: {{ .Values.backend.sessionHours | quote }} }
            - { name: EVALUATOR_URL, value: "http://cap-evaluator:8080" }
          {{- include "cap.probes" . | nindent 10 }}
          {{- include "cap.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
{{ include "cap.service" $ctx }}

# Template for supplying your own secret values. Copy to secrets-<env>.yaml
# (gitignored), fill in, then:  kubectl apply -f scripts/secrets-<env>.yaml
# Never commit real values.
apiVersion: v1
kind: Namespace
metadata:
  name: cap
---
apiVersion: v1
kind: Secret
metadata:
  name: cap-db-credentials
  namespace: cap
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<superuser password>"
  APP_DB_PASSWORD: "<password for role cap_app>"
---
apiVersion: v1
kind: Secret
metadata:
  name: cap-app-secrets
  namespace: cap
type: Opaque
stringData:
  JWT_SECRET: "<64+ random characters>"
  CAP_ENCRYPTION_KEY: "<64+ random characters; encrypts connector PATs>"
  ADMIN_PASSWORD: "<initial password for user admin>"
---
apiVersion: v1
kind: Secret
metadata:
  name: cap-tls
  namespace: cap
type: kubernetes.io/tls
stringData:
  tls.crt: |
    <PEM certificate chain for cap.bupasec.com>
  tls.key: |
    <PEM private key>
